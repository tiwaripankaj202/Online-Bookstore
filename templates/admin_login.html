{% extends 'base.html' %}

{% block title %}Admin sign in{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container auth-layout">
        <div class="auth-aside">
            <p class="eyebrow">Store operations</p>
            <h1>Welcome back, admin.</h1>
            <p>Sign in to manage the library, orders, and store reports.</p>
        </div>
        <div class="form-card">
            <p class="eyebrow">Admin portal</p>
            <h2>Sign in</h2>
            <p>Use your administrator account to continue.</p>
            <form method="post" class="auth-form">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" autocomplete="username" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn">Login as admin <span aria-hidden="true">→</span></button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
